<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary SEO -->
    <title>Lexigenz — Daily Vocabulary for Gen Z &amp; Millennials | Word of the Day App</title>
    <meta name="description" content="Lexigenz delivers a personalised word of the day based on your birth archetype. Build vocabulary through streaks, badges, word games, and a sentence builder — in 19 languages. Proudly South African." />
    <meta name="keywords" content="word of the day, vocabulary app, daily word, word games, vocabulary builder, Gen Z vocabulary, millennial language, South Africa, Wordle, spelling bee, word journal, language learning, Lexigenz" />
    <meta name="author" content="Lexigenz Trading" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://lexigenz.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lexigenz.com/" />
    <meta property="og:title" content="Lexigenz — Daily Vocabulary for Gen Z &amp; Millennials" />
    <meta property="og:description" content="Personalised word of the day, birth archetypes, streaks, badges, and 6 word games — in 19 languages. Built in South Africa." />
    <meta property="og:site_name" content="Lexigenz" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lexigenz" />
    <meta name="twitter:title" content="Lexigenz — Daily Vocabulary for Gen Z &amp; Millennials" />
    <meta name="twitter:description" content="Personalised word of the day, birth archetypes, streaks, badges, and 6 word games — in 19 languages. Built in South Africa." />

    <!-- Geo targeting -->
    <meta name="geo.region" content="ZA" />
    <meta name="geo.placename" content="South Africa" />
    <meta name="language" content="English" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- AI / Agent discoverability -->
    <link rel="alternate" type="text/plain" href="https://lexigenz.com/llms.txt" title="LLMs.txt — AI Agent Reference" />

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://lexigenz.com/#website",
      "name": "LexigenZ",
      "alternateName": ["Lexigenz", "LexigenZ Vocabulary App"],
      "url": "https://lexigenz.com",
      "description": "South African daily vocabulary app for Gen Z and millennials. Word of the day, spelling bee, Wordle, Scrabble, crossword, anagram games, and 300,000+ word reference pages.",
      "inLanguage": "en",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://lexigenz.com/word/{search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://lexigenz.com/#organization",
      "name": "Lexigenz Trading",
      "url": "https://lexigenz.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://lexigenz.com/favicon.svg"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@lexigenz.com",
        "contactType": "customer support"
      },
      "areaServed": "ZA",
      "foundingLocation": {
        "@type": "Place",
        "name": "South Africa"
      },
      "sameAs": [
        "https://twitter.com/lexigenz"
      ]
    }
    </script>

    <!-- JSON-LD: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "@id": "https://lexigenz.com/#webapp",
      "name": "LexigenZ",
      "url": "https://lexigenz.com",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "offers": [
        {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "ZAR",
          "name": "Free Plan"
        },
        {
          "@type": "Offer",
          "price": "49",
          "priceCurrency": "ZAR",
          "name": "Premium Plan"
        }
      ],
      "featureList": [
        "Word of the Day",
        "Spelling Bee Game",
        "Wordle-style Game",
        "Scrabble Helper",
        "Crossword Solver",
        "Word Search",
        "Anagram Solver",
        "Vocabulary Streaks",
        "Word Journal",
        "19 Languages Supported",
        "Birth Archetype Personalisation",
        "300,000+ Word Reference Pages"
      ],
      "inLanguage": "en",
      "audience": {
        "@type": "Audience",
        "audienceType": "Gen Z, Millennials, Students, Professionals"
      }
    }
    </script>

    <!-- JSON-LD: SiteLinksSearchBox -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "LexigenZ — Daily Vocabulary Builder",
      "url": "https://lexigenz.com",
      "speakable": {
        "@type": "SpeakableSpecification",
        "cssSelector": ["h1", "h2", ".word-of-the-day", ".speakable"]
      },
      "isPartOf": {
        "@id": "https://lexigenz.com/#website"
      }
    }
    </script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9774952664394142"
     crossorigin="anonymous"></script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Adsterra Social Bar — global, loads after body -->
    <script src="https://contributionhobblenewlywed.com/28/25/96/28259667b9ee71a7c6ca1b8e6b8cdc64.js"></script>
  </body>
</html>
